[package]
name = "slint-widgets"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
documentation = "https://docs.rs/slint-widgets"
keywords = ["slint", "widgets", "gui", "desktop"]
categories = ["gui"]
include = ["src/**", "examples/**", "README.md", "LICENSE", "ui/**"]
description = "Slint component library with command palettes, Markdown blocks, code highlighting views, and copy and confirmation buttons."

# Only .slint files and their path: use it as a build-dependency and hand
# library_paths() to slint_build::CompilerConfiguration::with_library_paths.
[dependencies]
