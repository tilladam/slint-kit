[package]
name = "desktop-clipboard"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Clipboard attachments for desktop apps: file lists, or images as their original encoded bytes for bounded decoding later."

[features]
# Off macOS there is no way yet to read the encoded image bytes, only arboard's
# fully decoded RGBA. Enabling this accepts that decode (bounded by size checks
# afterwards) and re-encodes PNG; without it, images off macOS read as `None`.
decoding-fallback = []

[dependencies]
arboard = "3.6.1"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "tiff"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSPasteboard"] }
objc2-foundation = "0.3"
