[package]
name = "md-segments"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
documentation = "https://docs.rs/md-segments"
keywords = ["markdown", "syntax-highlighting", "desktop", "emoji"]
categories = ["text-processing"]
include = ["src/**", "examples/**", "README.md", "LICENSE"]
description = "Markdown split into renderable segments (prose, headings, code, quotes, tables), syntax highlighting, and inline helpers (bare-URL linking, :shortcode: emoji)."

[features]
default = ["highlight"]
# syntect is the heavy dependency; frontends that only segment can drop it.
highlight = ["dep:syntect"]

[dependencies]
emoji-shortcodes = { path = "../emoji-shortcodes", version = "0.1.0" }
pulldown-cmark = "0.13.4"
# Only bundled syntax/theme assets and the Rust regex engine are needed;
# YAML/plist loaders and HTML output are unused by the span highlighter.
syntect = { version = "5.3.0", default-features = false, features = ["default-syntaxes", "default-themes", "regex-fancy"], optional = true }
