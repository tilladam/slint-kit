[package]
name = "md-segments"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Markdown split into renderable segments (prose, headings, code, quotes, tables), syntax highlighting, and inline helpers (bare-URL linking, :shortcode: emoji)."

[features]
default = ["highlight"]
# syntect is the heavy dependency; frontends that only segment can drop it.
highlight = ["dep:syntect"]

[dependencies]
emoji-shortcodes = { path = "../emoji-shortcodes", version = "0.1.0" }
pulldown-cmark = "0.13.4"
syntect = { version = "5.3.0", default-features = false, features = ["default-fancy"], optional = true }
