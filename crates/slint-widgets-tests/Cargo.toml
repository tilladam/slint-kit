[package]
name = "slint-widgets-tests"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Headless interaction tests for slint-kit components"

[dev-dependencies]
slint = { version = "=1.18.1", default-features = false, features = ["std", "compat-1-18"] }
i-slint-backend-testing = "=1.18.1"
md-segments = { path = "../md-segments", default-features = false }
slint-model-sync = { path = "../slint-model-sync" }

[build-dependencies]
slint-build = "=1.18.1"
slint-widgets = { path = "../slint-widgets" }
