name: CI

on:
  push:
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      # Cargo can't run on a workspace without members; skip until the first crate lands.
      - name: Look for crates
        id: crates
        run: |
          if compgen -G "crates/*/Cargo.toml" > /dev/null; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No crates yet; skipping cargo steps."
          fi

      - uses: dtolnay/rust-toolchain@stable
        if: steps.crates.outputs.present == 'true'
        with:
          components: rustfmt, clippy

      # Slint's core links fontconfig on Linux, even without a backend or renderer.
      - name: Linux system libraries for Slint
        if: steps.crates.outputs.present == 'true' && runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfontconfig-dev

      - name: Format
        if: steps.crates.outputs.present == 'true'
        run: cargo fmt --all --check

      - name: Clippy
        if: steps.crates.outputs.present == 'true'
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test
        if: steps.crates.outputs.present == 'true'
        run: cargo test --workspace --all-features

      # Check separately: the gallery otherwise re-enables md-segments defaults.
      - name: Test without default features
        if: steps.crates.outputs.present == 'true'
        run: |
          cargo test -p md-segments --no-default-features
          cargo test -p desktop-clipboard --no-default-features
          cargo test -p desktop-notify --no-default-features

      - name: Documentation
        if: steps.crates.outputs.present == 'true'
        env:
          RUSTDOCFLAGS: -D warnings
        run: |
          cargo doc --workspace --all-features --no-deps
          cargo doc -p md-segments --no-default-features --no-deps
          cargo doc -p desktop-clipboard --no-default-features --no-deps
          cargo doc -p desktop-notify --no-default-features --no-deps

      - name: Pure examples
        run: |
          cargo run -p palette-rank --example rank
          cargo run -p slint-model-sync --example reconcile

      # The README's rule: no path dependencies outside this repository.
      - name: No path dependencies outside the repo
        if: steps.crates.outputs.present == 'true'
        run: |
          python - <<'PY'
          import json, pathlib, subprocess
          root = pathlib.Path.cwd().resolve()
          metadata = json.loads(subprocess.check_output(["cargo", "metadata", "--format-version", "1"]))
          outside = [p["manifest_path"] for p in metadata["packages"]
                     if p["source"] is None and not pathlib.Path(p["manifest_path"]).resolve().is_relative_to(root)]
          if outside:
              raise SystemExit("Path dependencies outside the repo: " + ", ".join(outside))
          PY

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Look for crates
        id: crates
        run: |
          if compgen -G "crates/*/Cargo.toml" > /dev/null; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      # Licences and sources per deny.toml (crates.io only, no GPL/AGPL-only crates).
      - uses: EmbarkStudios/cargo-deny-action@v2
        if: steps.crates.outputs.present == 'true'
        with:
          command: check licenses sources bans
